<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F5F9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Clases">
<title>Clases · Registro</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📒</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16213A; --muted:#667085; --line:#E3E6EE; --paper:#F4F5F9; --card:#FFFFFF;
  --accent:#2F4BD8; --pay:#0A7A4B; --pay-bg:#E8F6EF; --debt:#B42318; --debt-bg:#FDEDEC;
  --font:"Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --tone:var(--pay);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.app{max-width:480px;margin:0 auto;padding:20px 18px 48px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;align-items:center;justify-content:space-between;margin:4px 0 22px}
header h1{font-size:1.15rem;font-weight:700;margin:0;letter-spacing:-.01em}
header p{margin:2px 0 0;color:var(--muted);font-size:.85rem}
.icon-btn{border:0;background:transparent;padding:8px;border-radius:10px;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--line)}

.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--line);border-radius:12px;padding:4px;margin-bottom:18px}
.seg button{border:0;background:transparent;padding:10px;border-radius:9px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(22,33,58,.08)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:.82rem;color:var(--muted);margin-bottom:6px;font-weight:500}
select,input[type=date],input[type=text],input[type=url],input[type=password]{
  width:100%;padding:12px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;font-size:1rem;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.row{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}

.saldo-actual{font-size:.88rem;margin:-6px 0 16px;min-height:1.2em;color:var(--muted)}
.saldo-actual b.debe{color:var(--debt)} .saldo-actual b.favor{color:var(--pay)}

/* El monto es el protagonista */
.monto{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--tone);padding:6px 2px 8px;margin:4px 0 18px;transition:border-color .2s}
.monto span{font-size:2rem;font-weight:600;color:var(--tone);transition:color .2s}
.monto input{border:0;outline:0;background:transparent;width:100%;font-size:3.1rem;font-weight:700;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;color:var(--tone);padding:0;transition:color .2s}
.monto input::placeholder{color:#C9CEDA}
.monto:focus-within{border-bottom-width:3px}
.monto-hint{font-size:.8rem;color:var(--muted);margin:-12px 0 16px}
.duracion{margin-bottom:6px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 4px;font-weight:600;color:var(--muted);cursor:pointer}
.chips button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.otra{display:flex;align-items:center;gap:8px;margin-top:8px}
.otra input{width:100px!important}
.otra span{color:var(--muted);font-size:.9rem}
.app[data-tipo="Clase"]{--tone:var(--ink)}

.primary{width:100%;border:0;border-radius:13px;padding:15px;font-size:1.02rem;font-weight:700;background:var(--tone);color:#fff;cursor:pointer;transition:background .2s,opacity .2s}
.primary:disabled{opacity:.5;cursor:default}

.toast{margin:14px 0 0;padding:12px 14px;border-radius:12px;font-size:.92rem;display:none}
.toast.ok{display:block;background:var(--pay-bg);color:var(--pay)}
.toast.err{display:block;background:var(--debt-bg);color:var(--debt)}

h2{font-size:.95rem;font-weight:700;margin:30px 2px 10px}
.lista{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.lista li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line)}
.lista li:first-child{border-top:0}
.lista button.li{all:unset;display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;cursor:pointer}
.lista .n{font-weight:600}
.lista .s{font-size:.8rem;color:var(--muted);margin-top:2px}
.lista .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.lista .v small{display:block;font-weight:500;font-size:.75rem}
.debe{color:var(--debt)} .favor{color:var(--pay)} .aldia{color:var(--muted)}
.vacio{padding:16px;color:var(--muted);font-size:.9rem}
.total{display:flex;justify-content:space-between;font-size:.88rem;color:var(--muted);margin:8px 4px 0}
.total b{color:var(--debt);font-variant-numeric:tabular-nums}

#setup p{color:var(--muted);font-size:.9rem;line-height:1.5;margin:0 0 16px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="app" data-tipo="Pago">
  <header>
    <div>
      <h1>Clases particulares</h1>
      <p id="sub">Registro de pagos</p>
    </div>
    <button class="icon-btn" id="btnAjustes" aria-label="Configuración">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <!-- Configuración inicial -->
  <section id="setup" class="panel" hidden>
    <p>Conectá esta página con tu hoja de Google. Estos datos quedan guardados solo en este dispositivo.</p>
    <label class="field"><span>URL de la aplicación web (Apps Script)</span>
      <input type="url" id="cfgUrl" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"></label>
    <label class="field"><span>PIN</span>
      <input type="password" id="cfgPin" autocomplete="off"></label>
    <button class="primary" id="btnConectar">Conectar</button>
    <div class="toast" id="setupMsg" role="status"></div>
  </section>

  <!-- Carga -->
  <section id="carga" hidden>
    <div class="seg" role="group" aria-label="Tipo de movimiento">
      <button type="button" data-tipo="Pago" aria-pressed="true">Pago recibido</button>
      <button type="button" data-tipo="Clase" aria-pressed="false">Clase dada</button>
    </div>

    <div class="panel">
      <label class="field"><span>Alumno</span>
        <select id="alumno"><option value="">Cargando alumnos…</option></select></label>
      <div class="saldo-actual" id="saldoActual" aria-live="polite"></div>

      <div class="field duracion" id="duracion" hidden>
        <span>¿Cuánto duró la clase?</span>
        <div class="chips" role="group" aria-label="Duración">
          <button type="button" data-h="1" aria-pressed="true">1 h</button>
          <button type="button" data-h="1.5" aria-pressed="false">1½ h</button>
          <button type="button" data-h="2" aria-pressed="false">2 h</button>
          <button type="button" data-h="otra" aria-pressed="false">Otra</button>
        </div>
        <div class="otra" id="otraWrap" hidden>
          <input type="text" id="horasOtra" inputmode="decimal" placeholder="2,5" aria-label="Horas"><span>horas</span>
        </div>
      </div>

      <label class="monto" aria-label="Monto">
        <span>$</span><input id="monto" inputmode="numeric" autocomplete="off" placeholder="0">
      </label>
      <p class="monto-hint" id="montoHint"></p>

      <div class="row">
        <label class="field"><span>Fecha</span><input type="date" id="fecha"></label>
        <label class="field"><span>Detalle (opcional)</span><input type="text" id="detalle" placeholder="Transferencia"></label>
      </div>

      <button class="primary" id="btnGuardar">Guardar pago</button>
      <div class="toast" id="msg" role="status"></div>
    </div>

    <h2>Saldos</h2>
    <ul class="lista" id="saldos"><li class="vacio">Cargando…</li></ul>
    <div class="total" id="total"></div>

    <h2>Últimos movimientos</h2>
    <ul class="lista" id="recientes"><li class="vacio">Cargando…</li></ul>
  </section>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const app = document.querySelector('.app');
  const fmt = n => '$ ' + Math.abs(Math.round(n)).toLocaleString('es-AR');
  const store = {
    get(k){ try { return localStorage.getItem(k) || ''; } catch { return ''; } },
    set(k,v){ try { localStorage.setItem(k, v); } catch {} }
  };

  let tipo = 'Pago';
  let alumnos = [];
  let horas = 1;          // duración elegida para "Clase dada"
  let montoManual = false; // true si el usuario escribió el monto a mano

  // ---------- comunicación con la hoja ----------
  async function api(payload, url = store.get('url'), pin = store.get('pin')) {
    const res = await fetch(url, { method: 'POST', body: JSON.stringify({ ...payload, pin }) });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'Error desconocido.');
    return json.data;
  }

  // ---------- pantallas ----------
  function mostrarSetup(msg) {
    $('carga').hidden = true; $('setup').hidden = false;
    $('cfgUrl').value = store.get('url'); $('cfgPin').value = store.get('pin');
    toast($('setupMsg'), msg || '', 'err');
  }
  function mostrarCarga() { $('setup').hidden = true; $('carga').hidden = false; }

  function toast(el, text, kind) {
    el.textContent = text; el.className = 'toast' + (text ? ' ' + kind : '');
  }

  function estado(saldo) {
    if (saldo < 0) return { cls: 'debe', txt: 'Debe' };
    if (saldo > 0) return { cls: 'favor', txt: 'A favor' };
    return { cls: 'aldia', txt: 'Al día' };
  }

  // ---------- render ----------
  function render(data) {
    alumnos = data.alumnos;
    const sel = $('alumno'), prev = sel.value || store.get('ultimoAlumno');
    sel.innerHTML = alumnos.length
      ? '<option value="">Elegí un alumno</option>' + alumnos.map(a => `<option>${esc(a.nombre)}</option>`).join('')
      : '<option value="">No hay alumnos en la hoja</option>';
    if (alumnos.some(a => a.nombre === prev)) sel.value = prev;

    const orden = [...alumnos].sort((a, b) => a.saldo - b.saldo);
    $('saldos').innerHTML = orden.length ? orden.map(a => {
      const e = estado(a.saldo);
      return `<li><button class="li" data-alumno="${esc(a.nombre)}">
        <div><div class="n">${esc(a.nombre)}</div><div class="s">${esc(a.responsable || '')}${a.clases ? ' · ' + a.clases + (a.clases === 1 ? ' clase' : ' clases') : ''}</div></div>
        <div class="v ${e.cls}">${a.saldo ? fmt(a.saldo) : '–'}<small>${e.txt}</small></div></button></li>`;
    }).join('') : '<li class="vacio">Agregá alumnos en la pestaña Alumnos de la hoja.</li>';

    const deuda = alumnos.reduce((s, a) => s + (a.saldo < 0 ? -a.saldo : 0), 0);
    $('total').innerHTML = deuda ? `<span>Total que te deben</span><b>${fmt(deuda)}</b>` : '';

    $('recientes').innerHTML = data.recientes.length ? data.recientes.map(m => {
      const esPago = m.tipo === 'Pago';
      return `<li><div><div class="n">${esc(m.alumno)}</div>
        <div class="s">${fechaCorta(m.fecha)} · ${esc(m.tipo)}${m.detalle ? ' · ' + esc(m.detalle) : ''}</div></div>
        <div class="v ${esPago ? 'favor' : ''}">${esPago ? '+ ' + fmt(m.pago) : fmt(m.cargo)}</div></li>`;
    }).join('') : '<li class="vacio">Todavía no hay movimientos.</li>';

    actualizarSaldoActual();
  }

  function actualizarSaldoActual() {
    const a = alumnos.find(x => x.nombre === $('alumno').value);
    const el = $('saldoActual');
    if (!a) { el.innerHTML = ''; $('montoHint').textContent = ''; return; }
    const e = estado(a.saldo);
    el.innerHTML = a.saldo === 0 ? 'Saldo actual: al día'
      : `Saldo actual: <b class="${e.cls}">${e.cls === 'debe' ? 'debe ' : ''}${fmt(a.saldo)}${e.cls === 'favor' ? ' a favor' : ''}</b>`;
    recalcular();
  }

  // Clase dada: monto = tarifa por hora × horas (salvo que lo hayas escrito a mano)
  function recalcular() {
    const a = alumnos.find(x => x.nombre === $('alumno').value);
    const hint = $('montoHint');
    if (tipo !== 'Clase' || !a) { hint.textContent = ''; return; }
    if (!a.tarifa) { hint.textContent = 'Este alumno no tiene tarifa cargada en la hoja: escribí el monto.'; return; }
    const calc = Math.round(a.tarifa * horas);
    if (!montoManual && horas > 0) setMonto(calc);
    hint.textContent = horas > 0
      ? `${fmtHoras(horas)} × ${fmt(a.tarifa)} por hora = ${fmt(calc)}` + (montoManual && leerMonto() !== calc ? ' · monto editado a mano' : '')
      : 'Ingresá cuántas horas duró.';
  }

  function setHoras(h) {
    document.querySelectorAll('.chips button').forEach(b => b.setAttribute('aria-pressed', b.dataset.h === h));
    const otra = h === 'otra';
    $('otraWrap').hidden = !otra;
    horas = otra ? leerHorasOtra() : Number(h);
    if (otra) $('horasOtra').focus();
    montoManual = false;
    recalcular();
  }
  function leerHorasOtra() { return Number($('horasOtra').value.replace(',', '.')) || 0; }
  function fmtHoras(h) { return (Number.isInteger(h) ? h : h.toLocaleString('es-AR')) + ' h'; }

  // ---------- utilidades ----------
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
  function hoy() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
  function fechaCorta(iso) { const [y, m, d] = String(iso).split('-'); return d ? `${d}/${m}` : iso; }
  function leerMonto() { return Number($('monto').value.replace(/\D/g, '')) || 0; }
  function setMonto(n) { $('monto').value = n ? Number(n).toLocaleString('es-AR') : ''; }

  function setTipo(t) {
    tipo = t; app.dataset.tipo = t;
    document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.tipo === t));
    $('btnGuardar').textContent = t === 'Pago' ? 'Guardar pago' : 'Guardar clase';
    $('detalle').placeholder = t === 'Pago' ? 'Transferencia' : 'Tema de la clase';
    $('duracion').hidden = t !== 'Clase';
    setMonto(''); montoManual = false;
    actualizarSaldoActual();
  }

  async function cargar() {
    try { render(await api({ action: 'data' })); }
    catch (e) { mostrarSetup('No se pudo conectar con la hoja: ' + e.message); }
  }

  // ---------- eventos ----------
  document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => setTipo(b.dataset.tipo)));
  $('alumno').addEventListener('change', () => { store.set('ultimoAlumno', $('alumno').value); montoManual = false; if (tipo === 'Clase') setMonto(''); actualizarSaldoActual(); });
  $('monto').addEventListener('input', () => { setMonto(leerMonto()); montoManual = true; recalcular(); });
  document.querySelectorAll('.chips button').forEach(b => b.addEventListener('click', () => setHoras(b.dataset.h)));
  $('horasOtra').addEventListener('input', () => { horas = leerHorasOtra(); montoManual = false; recalcular(); });
  $('saldos').addEventListener('click', e => {
    const b = e.target.closest('[data-alumno]'); if (!b) return;
    $('alumno').value = b.dataset.alumno; $('alumno').dispatchEvent(new Event('change'));
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  $('btnAjustes').addEventListener('click', () => mostrarSetup());

  $('btnConectar').addEventListener('click', async () => {
    const url = $('cfgUrl').value.trim(), pin = $('cfgPin').value.trim();
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) return toast($('setupMsg'), 'La URL tiene que empezar con https://script.google.com/ y terminar en /exec.', 'err');
    if (!pin) return toast($('setupMsg'), 'Ingresá el PIN que pusiste en el script.', 'err');
    $('btnConectar').disabled = true; toast($('setupMsg'), '', '');
    try {
      const data = await api({ action: 'data' }, url, pin);
      store.set('url', url); store.set('pin', pin);
      mostrarCarga(); render(data);
    } catch (e) { toast($('setupMsg'), 'No se pudo conectar: ' + e.message, 'err'); }
    finally { $('btnConectar').disabled = false; }
  });

  $('btnGuardar').addEventListener('click', async () => {
    const alumno = $('alumno').value, monto = leerMonto();
    if (!alumno) return toast($('msg'), 'Elegí un alumno.', 'err');
    if (!monto) return toast($('msg'), 'Ingresá un monto mayor a cero.', 'err');
    const btn = $('btnGuardar'); btn.disabled = true; btn.textContent = 'Guardando…'; toast($('msg'), '', '');
    try {
      let detalle = $('detalle').value.trim();
      if (tipo === 'Clase' && horas > 0) detalle = fmtHoras(horas) + (detalle ? ' · ' + detalle : '');
      const data = await api({ action: 'add', alumno, tipo, monto, horas: tipo === 'Clase' ? horas : '', fecha: $('fecha').value, detalle });
      render(data);
      const a = alumnos.find(x => x.nombre === alumno), e = estado(a ? a.saldo : 0);
      const resto = !a || a.saldo === 0 ? 'queda al día' : e.cls === 'debe' ? `debe ${fmt(a.saldo)}` : `queda con ${fmt(a.saldo)} a favor`;
      toast($('msg'), `${tipo === 'Pago' ? 'Pago guardado' : 'Clase guardada'}. ${alumno} ${resto}.`, 'ok');
      $('detalle').value = ''; montoManual = false;
      if (tipo === 'Clase') setHoras('1'); else setMonto('');
    } catch (e) {
      toast($('msg'), 'No se guardó: ' + e.message, 'err');
    } finally {
      btn.disabled = false; btn.textContent = tipo === 'Pago' ? 'Guardar pago' : 'Guardar clase';
    }
  });

  // ---------- inicio ----------
  $('fecha').value = hoy();
  if (store.get('url') && store.get('pin')) { mostrarCarga(); cargar(); } else mostrarSetup();
})();
</script>
</body>
</html>
